app_name: "openclaw-stdin-sqlite"
state_dir: ".openclaw-state"

http:
  addr: "127.0.0.1:18080"

admin:
  enabled: true
  addr: "127.0.0.1:18089"
  static_mounts:
    - path: "/chat/"
      dir: "../examples/agui/client/tdesign-chat/dist"

agent:
  type: "llm"
  planner_type: "builtin"
  planner_config:
    verification_prompt: "验证执行结果是否符合预期"
  instruction: |
    你是资深电力工程造价工程师，专注输变电/配网工程概预算编制与审查，精通博微造价软件及电力定额标准。

    # 行为准则
    - 低成本可逆操作直接执行，无需确认
    - 禁止纯开场白式回复（"我将……"），必须包含实质内容
    - 需要工具时当回合调用；不需要时直接返回结果
    - 创建/发送/发布类操作须当回合完成并返回结果标识
    - 超2步任务先todo_write规划再逐项执行
    - 支持并发工具调用

    # 专业规范
    - 遵循"依据→分析→结论"，不可跳步
    - 定额套用须标注编号、名称、适用条件
    - 取费计算须列明基数、费率、依据文件
    - 工程量须说明公式和数据来源
    - 信息不足时明确指出缺失项，不模糊回答
    - 不确定内容标注置信度，不编造数据

    # 语言约束
    全程中文：thinking、回复、工具参数。违反视为任务失败。

    # 思考工具
    - sequential_thinking至少5步，工程分析按：问题定性→依据检索→数据核实→计算验证→结论可靠性
    - 可穿插bash命令辅助，不犹豫多次使用

    # 输出格式
    Markdown格式：标题组织结构、列表枚举、代码块包裹、表格对比、**加粗**关键、`反引号`术语。
    工程分析类回复按：问题概述→依据与前提→分析过程→计算结果→结论与建议。简单问题可直接回答。
      
  # system_prompt_dir: "./prompts/system"
  #max_history_runs: 50
  enable_context_budget: true
  preload_memory: 10
  enable_token_counter_calibration: false
  enable_detailed_context_metrics: true
  add_session_summary: true
  session_summary_injection_mode: "user"
  sync_summary_intra_run: false
  enable_context_compaction: true
  context_compaction_threshold_ratio: 0.4
  context_compaction_tool_result_max_tokens: 1024
  context_compaction_keep_recent_requests: 3
  context_compaction_oversized_tool_result_max_tokens: 8192
  context_compaction_force_clean_tool_names:
    - "subagents_get"
  context_compaction_keep_tool_names:
    - "session_load"
    - "session_search"

model:
  mode: "openai"
  name: "${OPENCLAW_MODEL_NAME}"
  openai_variant: "${OPENAI_MODEL_VARIANT}"
  context_window: 128000  
  token_tailoring:
    enabled: true
    strategy: "middle_out"
    include_output_schema_in_description: false
  generation_config:
    max_tokens: 12000
    temperature: 0.1
    stream: true
    thinking_enabled: false
    reasoning_effort: "high"

