session:
  backend: "sqlite"
  summary:
    enabled: true
    mode: "manual"
    policy: "any"
    max_words: 1000
    # 触发条件（任一满足即触发）
    context_threshold_ratio: 0.6
    #event_threshold: 40           # 自上次摘要后新增 40 个事件后触发
    token_threshold: 12288         # 自上次摘要后新增 12288 个 token 后触发
    #idle_threshold: "10m"

  config:
    path: "./data/sessions.sqlite"
    skip_db_init: false

