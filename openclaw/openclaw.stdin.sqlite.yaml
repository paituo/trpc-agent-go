app_name: "openclaw-stdin-sqlite"
state_dir: "./.openclaw-state/stdin-sqlite"

http:
  addr: "127.0.0.1:18080"

admin:
  enabled: false

agent:
  instruction: "You are a helpful assistant for terminal chat."

# Real model mode. Load credentials in shell before starting:
#   source ~/.zshrc
#   gpt52
model:
  mode: "openai"
  name: "${OPENCLAW_MODEL_NAME}"
  openai_variant: "auto"

# Mock mode example for local smoke tests:
# model:
#   mode: "mock"

channels:
  - type: "stdin"
    name: "terminal"
    config:
      from: "alice"
      show_prompt: true
      show_role_labels: true

session:
  backend: "sqlite"
  config:
    path: "./sessions.sqlite"
    skip_db_init: false

memory:
  backend: "sqlite"
  config:
    path: "./memories.sqlite"
    skip_db_init: false

skills:
  root: "./skills"
  tool_profile: "full"
  load_mode: "turn"

tools:
  enable_local_exec: true
  enable_openclaw_tools: true
  enable_parallel_tools: true
  providers:
  toolsets:
    - type: "file"
      name: "fs"
      config:
        base_dir: "."
        read_only: false
        enable_save: true
        enable_replace: true

debug_recorder:
  enabled: true
  mode: "full"

observability:
  langfuse:
    enabled: false
    required: false