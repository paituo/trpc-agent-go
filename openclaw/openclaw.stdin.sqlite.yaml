skills:
  root: "./skills"
  project_agents_root: false
  personal_agents_root: false
  managed_root: false
  debug: true
  watch: false
  tool_profile: "full"
  load_mode: "turn"
  tooling_guidance: >
    ## 技能规则

    1. **匹配即加载。** 用户提及技能名、斜杠命令或任务匹配技能描述时，
    当轮调用 `skill_load`，不得延迟、不得仅宣布而不调用、不得凭记忆作答。

    2. **加载先于回答。** 匹配时必须先加载 `SKILL.md`，再作答。
    相对路径从技能目录解析，只读必要内容，保持上下文最小。

    3. **持久归技能，轻量归记忆。** 工作流、集成、规则等持久能力
    → 创建或更新本地技能；简单事实或偏好 → 用记忆存储。

    4. **稳定与演进分离。** 平台代码管稳定边界（密钥、权限、校验、
    执行保障）；技能上下文管演进行为（触发、约束、示例、恢复、领域知识）。

    5. **最小且诚实。** 用最少的技能集覆盖任务；不从残缺记忆编造，
    先本地探索再提问；技能缺失时简述问题并优雅回退。创建技能须写文件、
    不存原始密钥、校验、刷新后使用，复用已有资产。

tools:
  enable_local_exec: true
  enable_openclaw_tools: true
  #enable_execute_tools: false
  enable_parallel_tools: true
  subagent:
    enable_subagent_tools: false
    enable_session_alias: false
  # tool_call_retry_policy:
  #   max_attempts: 3
  #   initial_interval_ms: 200
  #   backoff_factor: 2.0
  #   max_interval_ms: 2000
  #   jitter: true
  openclaw_tooling_guidance: >
    工具选择：上传文档用read_document/read_spreadsheet；交互输入用write_stdin/kill_session；
    有fs工具集时优先用fs而非exec_command；避免用exec_command读上传文件或打印OPENCLAW_*变量。
    消息：用message发送到当前会话；媒体文件（PDF/图片/音频/视频）必须通过message发送，
    仅提文件名不算发送；命令返回media_files/media_dirs时须调用message发送；
    Telegram语音回复用as_voice=true。
    上传：按媒体类型匹配已有上传（语音→audio、视频笔记→video），避免重复上传；
    路径用OPENCLAW_LAST_UPLOAD_PATH或OPENCLAW_SESSION_UPLOADS_DIR，
    文件名用OPENCLAW_LAST_*_NAME；仅用文件名和媒体类型引用，不暴露本地路径；
    创建/发送/发布/上传操作须当回合完成并返回结果标识。
    记忆：当前会话问题用conversation_history；跨会话持久事实才用memory工具；
    OPENCLAW_MEMORY_FILE存稳定事实/偏好/规则，用短条目更新；禁止存密钥或大段文本；
    OCR/PDF/音视频处理优先用本地工具。
    子代理与定时：长时间后台任务用subagents_spawn；小步骤不用，禁止嵌套；
    cron省略channel默认当前会话，写一次性指令；定时/循环任务用cron。

  providers:


  toolsets:
    - type: "file"
      name: "fs"
      config:
        base_dir: "."
        read_only: false
        enable_save: true
        enable_replace: true
        enable_read: true
        enable_read_multiple: true
        enable_list: true
        enable_search_file: true
        enable_search_content: true
        enable_file_manage: true
        enable_file_manage_move: true
        enable_file_manage_copy: true
        enable_file_manage_delete: true
        max_file_size: 61440

# Evolution is disabled by default. Set enabled to true to opt into
# asynchronous skill learning.
# evolution:
#   enabled: false
#   skill_scope:
#     mode: "app" # none|app|user
#   human_gate: "" # always|create

# Mock mode example for local smoke tests:
# model:
#   mode: "mock"
    - type: "lua"
      config:
        default_timeout: 600
        allow_io_lib: true
        allow_os_lib: true
        allow_fs_lib: true
        denied_modules: []
        denied_tools: []
        add_skill_script_dirs: true
        enable_debug: true
        allowed_script_dirs:
          - ./.openclaw-state
          - ./
    # 启用 agent_tool（纯 toolset 配置）
    - type: "agent_tool"
      name: "agent_tool"
      config:
        enabled: true
        history_scope: "parent_branch"
        stream_inner: true
        expose_tool_selection: false
        expose_instruction: false
        exclude_tools:
          - "exec_command"
          - "subagents_spawn"
          - "subagents_get"
          - "subagents_list"
          - "subagents_cancel"
          - "subagents_wait"
          - "agent_tool"
          - "message"
          - "cron"

channels:
  - type: "stdin"
    name: "terminal"
    config:
      from: "user"
      show_prompt: true
      show_role_labels: true
      user_label: "用户"
      assistant_label: "助手"

debug_recorder:
  enabled: true
  mode: "full"
observability:
  langfuse:
    enabled: true
    required: false
